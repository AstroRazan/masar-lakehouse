name: masar
version: "1.0.0"
config-version: 2
profile: masar

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  masar:
    staging:
      +materialized: view
    marts:
      silver:
        +materialized: incremental
        +file_format: delta
        # land silver tables under lakehouse/silver/<alias>, e.g. lakehouse/silver/trips
        +location_root: "{{ env_var('MASAR_HOME', '../..') }}/lakehouse/silver"
        +schema: silver
