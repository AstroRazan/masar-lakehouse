# dbt runs Spark in-process ("session" method): no Thrift server to start.
# MASAR_HOME is set by the Makefile; the default works when you run dbt from dbt/masar.
masar:
  target: dev
  outputs:
    dev:
      type: spark
      method: session
      schema: default
      host: NA
      threads: 1
      server_side_parameters:
        "spark.master": "local[*]"
        "spark.sql.extensions": "io.delta.sql.DeltaSparkSessionExtension"
        "spark.sql.catalog.spark_catalog": "org.apache.spark.sql.delta.catalog.DeltaCatalog"
        "spark.jars.packages": "io.delta:delta-spark_2.12:3.2.0"
        "spark.sql.warehouse.dir": "{{ env_var('MASAR_HOME', '../..') }}/lakehouse"
        "spark.hadoop.javax.jdo.option.ConnectionURL": "jdbc:derby:;databaseName={{ env_var('MASAR_HOME', '../..') }}/lakehouse/_metastore;create=true"
        "spark.sql.shuffle.partitions": "8"
